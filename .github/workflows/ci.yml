name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  REGISTRY: docker.io
  USERNAME: franperrone

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install backend deps
        run: npm install
      - name: Build backend
        run: npm run build
      - name: Test backend
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test

  #  Etapa para completar: build y push a Docker Hub
  docker-publish:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # TODO: Agregar login y docker build/push
      - name: Placeholder para build y push
        run: echo "Acá va el docker build y push a Docker Hub"