name: Test, Build and Push to ACR
on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write # Necesario para algunos registros, buena práctica tenerlo.
  id-token: write # Necesario para logins OIDC a futuro.

env:
  # Apuntamos al Azure Container Registry
  REGISTRY_NAME: grupo13tdi.azurecr.io
  BACKEND_IMAGE_NAME: tpi-back
  FRONTEND_IMAGE_NAME: tpi-front

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: todos_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./back
        run: pip install --no-cache-dir -r requirements.txt

      - name: Initialize database with init.sql
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_password < ./db/init.sql

      - name: Run backend tests
        working-directory: ./back
        env:
          DATABASE_URL: 'mysql+pymysql://todo_user:secure_password@127.0.0.1:3306/todos_db'
        run: python -m pytest

  build-and-push-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_NAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest

  build-and-push-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_NAME }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
